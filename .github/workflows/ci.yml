name: CI

on:
  # Run on every push to any branch, so schema/code drift is caught early.
  push:
  # Also run on pull requests and allow manual runs from the Actions tab.
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch to save CI minutes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:run

      - name: Run smart contract tests
        run: npm run test:contracts
